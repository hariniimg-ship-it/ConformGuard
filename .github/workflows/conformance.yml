name: Conformance guard
on:
  push:
  pull_request:
jobs:
  mock-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mock quality gate
        run: python -m conformguard.cli --combined --mock --output-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformguard-report
          path: artifacts/
